# Production stack for the web-hosting VM (DMZ). Public traffic arrives through
# Cloudflare Tunnel: cloudflared shares the external `web` network with nginx
# and proxies to `portfolio:80`, so no port is published on the host.
#
# One-time setup on the VM: `docker network create web`. DB_PASSWORD (and the
# rest of the production settings) come from `.env` next to this file.
#
# Only nginx joins `web`; app and db stay on this project's private network.
# Keep other projects from exposing a service called `app` on `web`, or
# nginx's `fastcgi_pass app:9000` could resolve to it.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - db
    command: sh -c "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && php-fpm"

  nginx:
    image: nginx:alpine
    container_name: portfolio
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - default
      - web

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

networks:
  web:
    external: true
