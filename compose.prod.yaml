# Production stack for the web-hosting VM (DMZ). Public traffic arrives through
# Cloudflare Tunnel: cloudflared shares the external `web-hosting` network with
# nginx and proxies to `portfolio-web:80`, so no port is published on the host.
#
# One-time setup on the VM: `docker network create web-hosting`. DB_PASSWORD
# (and the rest of the production settings) come from `.env` next to this file.
#
# Only nginx joins `web-hosting`; app and db stay on this project's private
# network. Keep other projects from exposing a service called `app` on
# `web-hosting`, or nginx's `fastcgi_pass app:9000` could resolve to it.

services:
  app:
    container_name: portfolio-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - db
    command: sh -c "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && php-fpm"

  nginx:
    image: nginx:alpine
    container_name: portfolio-web
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - default
      - web-hosting

  db:
    container_name: portfolio-db
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

networks:
  web-hosting:
    external: true
